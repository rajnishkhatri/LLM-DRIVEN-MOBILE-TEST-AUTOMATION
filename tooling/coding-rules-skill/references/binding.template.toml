# Workspace binding for the o1 coding-rules skill.
# Copy these keys into the target repo's .sdd/binding.toml under [coding-rules]
# (preferred, so all skills share one binding), or keep as .coding-rules.toml
# at the repo root. Every {{placeholder}} in rules-catalog.md and
# archunit-seeds.md resolves from here.

[coding-rules]
# Where the canonical catalog + seeds are installed in the target repo.
rules_home = "docs/coding-rules"
base_package = "com.bank.o1"          # root Java package — CHANGE ME

[coding-rules.modules]
# ADR 0005: three modules on the stage-1 cluster lines. Values are the
# Gradle/Maven module dirs (and package segments) in the target repo.
conversion = "conversion"
validation_certification = "validation-certification"
evidence = "evidence"

[coding-rules.seams]
# Package globs, ArchUnit syntax. Tighten to the real tree on first run.
# Keys that can hold MORE THAN ONE glob are arrays — never a " | "-joined
# string. ArchUnit's resideInAPackage/resideOutsideOfPackage take one package
# identifier; a joined string matches nothing, and as a `noClasses().that()`
# exclusion that silently widens the rule to the whole build (see the
# multi-glob warning in archunit-seeds.md). The rules reading these use the
# plural resideInAnyPackage(...) / resideOutsideOfPackages(...) forms.
invoke_models_adapter = "..invokemodels.adapter.."          # ADR 0001 seam
source_adapter_packages = "..ingestion.adapter.."           # F2 scope
source_adapter_internal_packages = ["..ingestion.adapter.internal.."]
storage_port_adapter = "..evidence.storage.adapter.."       # ADR 0011 port
async_seam_packages = ["..replay.dispatch..", "..review.dispatch.."]  # ADR 0007

[coding-rules.seams.provider_sdks]
# Provider/gateway SDK root packages banned outside the Invoke Models adapter
# (extend when the Phase 2 gateway SDK is known).
# These are the ONLY source for B-1's ban list — the seed no longer hardcodes a
# parallel copy. Values are ArchUnit globs and MUST carry the trailing `..`, or
# the rule matches only classes sitting directly in the root package and quietly
# under-bans a LOAD-BEARING rule. Suffix added 2026-08-09.
packages = ["org.springframework.ai..", "com.azure.ai..", "com.openai.."]

[coding-rules.thresholds]
# CR-18. A change here is a recorded decision (ADR trigger), not a tweak.
max_cyclomatic_complexity = 10
target_cyclomatic_complexity_core = 5
max_distance_from_main_sequence = 0.3
