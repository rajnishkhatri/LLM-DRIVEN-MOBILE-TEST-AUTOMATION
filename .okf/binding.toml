# OKF workspace-binding — LLM-DRIVEN-MOBILE-TEST-AUTOMATION
# Adapted from Architect 2026-08-11 for the MTA/spine/O7 design workspace.
# Keys marked <none> have no analog here — skill skips those rules.

[binding]
conventions_doc        = "docs/CONVENTIONS.md"
lint_gate              = "python .cursor/skills/okf-curator/scripts/okf_lint.py"
docs_home              = "docs/"
recipes_home           = "<none>"
authored_research_home = "<none>"
evidence_home          = "<none>"
context_mention_prefix = "<none>"
knowledge_globs        = [
  "cases/coding-rules/**/*.md",
  "cases/aws/**/*.md",
  "cases/aws-ai/**/*.md",
  "cases/claude-certification/**/*.md",
  "cases/claude-architect-foundation/**/*.md",
  "cases/data-intensive-design/**/*.md",
  "cases/fincancial-data-architecture/**/*.md",
  "cases/ml-solutions-arch/**/*.md",
  "cases/fde/**/*.md",
  "cases/SystemDesignPatterns/**/*.md",
  "docs/architecture/**/*.md",
  "docs/sdd/**/*.md",
  "docs/research/**/*.md",
  "docs/skills/**/*.md",
]

[lint]
declared_bundles  = ["cases/coding-rules", "cases/aws", "cases/aws-ai", "cases/claude-certification", "cases/claude-certification/platform-design", "cases/claude-certification/enterprise-integration-production", "cases/claude-certification/responsible-ai", "cases/claude-certification/stakeholder-engagement", "cases/claude-certification/team-enablement", "cases/claude-architect-foundation/aws-claude", "cases/data-intensive-design", "cases/fincancial-data-architecture", "cases/ml-solutions-arch", "cases/fde", "cases/SystemDesignPatterns", "docs/architecture"]
# `evals` = local live-evidence trees (probe reports, evidence bundles) that the
# sdd-roles plans reference by relative path but that stay uncommitted per
# evidence_home = <none>; classify as evidence so any such file is skipped as a
# generated artifact, never flagged as rot.
evidence_segments = ["outputs", "node_modules", "staging", "evals"]
evidence_suffixes = ["-workspace"]
run_dir_pattern   = "^run-\\d+$"
reserved          = ["index.md", "log.md", "README.md"]

[drift]
code_prefixes    = []
exclude_segments = ["/outputs/", "/node_modules/", "/staging/", "/evals/"]
