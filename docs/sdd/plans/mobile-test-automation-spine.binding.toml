# ─────────────────────────────────────────────────────────────────────────────
# RESOLVED `[coding-rules]` binding for the mobile-test-automation SPINE repo.
#
# This file is a spine T01 deliverable (Amendment A2/A4), held here because the
# spine repo does not exist yet. T01 appends it verbatim to `$SPINE/.sdd/
# binding.toml`. It REPLACES `binding.template.toml` for this repo — the
# template's defaults are o1-shaped and several are wrong for the spine tree.
#
# Resolved 2026-08-09. Provenance for every value is in the comment above it.
# Owner-supplied: `base_package` only. Everything else is derived from the
# APPROVED spine plan §2 (`mobile-test-automation-spine.plan.md:29-56`) and the
# ADRs named inline. Nothing here is invented; the three genuinely
# underdetermined values carry an explicit CHANGE-ME and say what to ask.
#
# ⚠ Multi-glob values are ARRAYS, not " | "-joined strings. The template used
#   the joined form; ArchUnit's `resideOutsideOfPackage` / `resideInAPackage`
#   take ONE package identifier, so a joined string matches no package and the
#   rule mis-fires. Seeds B-2 and D-2 were switched to the plural
#   `resideOutsideOfPackages` / `resideInAnyPackage` forms to consume arrays.
#   See archunit-seeds.md and tasks Amendment A4.
# ─────────────────────────────────────────────────────────────────────────────

[coding-rules]
# Where T01 installs the canonical catalog + seeds (AGENTS.md pointer table).
rules_home = "docs/coding-rules"

# OWNER-SUPPLIED 2026-08-09. The only value with no derivation — asked for,
# not guessed, per the skill's own rule.
base_package = "com.bank.spine"

[coding-rules.modules]
# plan §2:30-56 + AGENTS.md Layout — "five Maven modules plus a thin assembly",
# not the template's three. ADR 0005 partitions the DOMAIN into three clusters;
# the PLAN-OK ruling (2026-07-28) added `spine-contracts` (kernel) and
# `screening` (library) as non-partitions, plus a thin `app`. Values are Maven
# module directory names.
# `architecture_tests` is listed for completeness but is NOT a sixth partition —
# the plan writes it `architecture-tests/ (or in app/)`, i.e. its home is still
# T01's call. Nothing in the seeds reads this key.
spine_contracts          = "spine-contracts"      # IR records, marker enums, schema export
screening                = "screening"            # ADR 0009 shared library
conversion               = "conversion"           # cluster module
validation_certification = "validation-certification"
evidence                 = "evidence"             # cluster module
app                      = "app"                  # thin assembly — the ONLY deployable (ADR 0005)
architecture_tests       = "architecture-tests"   # ArchUnit host, CI-blocking

# ASSUMED package mapping: `<base_package>.<module dir with hyphens removed>`.
# Only B-3b depends on it (`{{base_package}}.evidence..`); every other glob is
# written `..name..`, which ArchUnit matches at any depth, so the module package
# root does not need to be known. CHANGE-ME if `validation-certification` maps to
# anything other than `com.bank.spine.validationcertification`.

[coding-rules.seams]
# Package globs, ArchUnit syntax. Seeds say: tighten to the real tree on first
# run, and record any WEAKENING as a finding, never a silent tweak.

# ADR 0001:142 (F1, load-bearing). ⚠ RESERVED AND EMPTY IN PHASE 1 — the spine
# has no model call at all: plan:16, "No UI, no LLM call, no gateway credential
# anywhere — by construction; F1 makes it CI-fail." With no class in this
# package, B-1 reads as "no provider SDK ANYWHERE", which is exactly plan:16's
# intent. The glob is kept non-empty so the adapter has a declared home when the
# weeks-3-8 reasoning path lands. CHANGE-ME then: confirm the adapter's real
# home before the first model call — it is NOT decided today.
invoke_models_adapter = "..invokemodels.adapter.."

# ADR 0001:145-147 (F2, load-bearing). plan §2:39-41 — `conversion` holds
# `ingestion (adapter contract, excel/, octane/, canonicalization, snapshot
# digest)`. F2's subject is the whole ingestion package: IR is the only thing
# that leaves it.
source_adapter_packages = "..conversion.ingestion.."

# The vendor-typed internals F2 forbids anyone outside ingestion from touching.
# plan §2:39 names exactly two: `excel/` (POI) and `octane/` (Octane/ALM) —
# which is also T02's F2 wording, "no POI/Octane/ALM type beyond its adapter
# package". The template's `..ingestion.adapter.internal..` names a package the
# approved tree does not have; these two replace it.
source_adapter_internal_packages = [
  "..conversion.ingestion.excel..",
  "..conversion.ingestion.octane..",
]

# ADR 0011 S3 port. plan §2:46 — `evidence` holds `objectstorage (S3 port +
# MinIO adapter)`. The template said `..evidence.storage.adapter..`; the
# approved tree says `objectstorage`, not `storage`.
# ADR 0011 is Proposed / PROBE-PENDING — the PORT is decided, only the
# production BINDING waits on the week-0 probe, so this glob is safe now.
storage_port_adapter = "..evidence.objectstorage.adapter.."

# ADR 0007:55-56 places queues at exactly two seams: Coordinate Conversion →
# Replay on Devices, and Coordinate Conversion → Route Human Decisions.
# ⚠ ONLY THE DEVICE SEAM IS IN THE SPINE. plan:58's component mapping excludes
# Route Human Decisions from the spine subset, and Coordinate Conversion exists
# here "only as the thin CI-side enqueue path". So: the outbox producer in
# `evidence` (plan §2:46, "outbox+queue") and the device-gate worker consumer in
# `validation-certification` (plan §2:42-43, "devicegate (worker, artifact pull,
# record-actual)"). The template's `..replay.dispatch.. | ..review.dispatch..`
# names neither package in the approved tree.
# CHANGE-ME when ADR 0008's review path enters scope — add the review-dispatch
# package THEN. Adding a third entry for any other reason is a new async seam
# and needs a superseding ADR (ADR 0007:95, "No third queue").
async_seam_packages = [
  "..evidence.outbox..",
  "..validationcertification.devicegate..",
]

[coding-rules.seams.provider_sdks]
# Ban list for B-1 — SDK roots that must not appear outside the Invoke Models
# adapter. Template default kept deliberately: the spine names no provider or
# gateway SDK anywhere (it makes no model call), so this is a purely defensive
# list and over-banning costs nothing.
# CHANGE-ME: extend with the Phase-2 gateway SDK when it is known — still
# UNRESOLVED (open item, and INSTALL.md flags it too).
# NOT on this list on purpose: the Appium `java-client` and Perfecto access.
# Those are the device path, not a model provider, and are allowlisted.
#
# ⚠ These values are the ONLY source for B-1's ban list — the seed used to
#   hardcode a parallel copy alongside an orphaned `{{provider_sdk_packages}}`
#   placeholder that matched no binding key, so this list never actually reached
#   the rule. Fixed 2026-08-09. Every entry MUST carry the trailing `..`:
#   without it ArchUnit matches only classes sitting directly in the root
#   package, silently under-banning a LOAD-BEARING rule.
packages = ["org.springframework.ai..", "com.azure.ai..", "com.openai.."]

[coding-rules.thresholds]
# CR-18. Left at defaults deliberately — changing one is an ADR-level decision,
# not an edit (rules-catalog CR-18; INSTALL.md step 2; next-items plan I2).
# "Someone proposes editing a threshold to make CI green" is the named
# anti-pattern; route it to an ADR.
max_cyclomatic_complexity = 10
target_cyclomatic_complexity_core = 5
max_distance_from_main_sequence = 0.3
